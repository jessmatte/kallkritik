<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lektion 3: Bygglabbet – Källkritik & Slutgenrep – Naturkunskap 1a1</title>
  <style>
    :root {
      /* Ljust läge (Standard) */
      --bg-main: #f4f6f9;
      --bg-header: #ffffff;
      --bg-card: #ffffff;
      --bg-card-alt: #f1f5f9;
      --bg-input: #ffffff;
      --bg-completed: #f8fafc;
      --accent: #d97706;
      --accent-hover: #b45309;
      --accent-text: #ffffff;
      --blue: #0369a1;
      --blue-bg: #e0f2fe;
      --green: #15803d;
      --green-bg: #dcfce7;
      --red: #b91c1c;
      --red-bg: #fee2e2;
      --purple: #7e22ce;
      --purple-bg: #f3e8ff;
      --text-main: #0f172a;
      --text-heading: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
      --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      --radius: 14px;
    }

    body.dark-mode {
      --bg-main: #12161c;
      --bg-header: #0d1117;
      --bg-card: #1b222c;
      --bg-card-alt: #232c38;
      --bg-input: #101419;
      --bg-completed: #161d26;
      --accent: #f59e0b;
      --accent-hover: #fbbf24;
      --accent-text: #111827;
      --blue: #38bdf8;
      --blue-bg: rgba(56, 189, 248, 0.14);
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.15);
      --red: #f87171;
      --red-bg: rgba(248, 113, 113, 0.15);
      --purple: #c084fc;
      --purple-bg: rgba(192, 132, 252, 0.15);
      --text-main: #f3f4f6;
      --text-heading: #ffffff;
      --text-muted: #cbd5e1;
      --border: #334155;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-size: 18px;
      line-height: 1.65;
      letter-spacing: 0.012em;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Sticky Top Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-header);
      border-bottom: 2px solid var(--border);
      padding: 10px 18px;
      box-shadow: var(--shadow);
    }

    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.12rem;
      color: var(--accent);
    }

    .brand-badge {
      background: var(--accent);
      color: var(--accent-text);
      padding: 2px 9px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Level Segmented Switch */
    .level-switch {
      display: inline-flex;
      background-color: var(--bg-card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .level-btn {
      padding: 6px 11px;
      font-size: 0.86rem;
      font-weight: 800;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
    }

    .level-btn.active-e {
      background-color: var(--green-bg);
      color: var(--green);
      border-color: var(--green);
    }

    .level-btn.active-ca {
      background-color: var(--purple-bg);
      color: var(--purple);
      border-color: var(--purple);
    }

    .voice-select {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      max-width: 175px;
      cursor: pointer;
    }

    .progress-wrap {
      max-width: 980px;
      margin: 8px auto 0;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background-color: var(--bg-card-alt);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #f59e0b);
      transition: width 0.35s ease;
    }

    /* Main Container */
    main {
      max-width: 980px;
      margin: 22px auto 64px;
      padding: 0 16px;
    }

    /* Teacher Walkthrough Panel (Shift+L) */
    .teacher-panel {
      background: linear-gradient(135deg, #1e1b4b, #172554);
      border: 2px solid #818cf8;
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 20px;
      color: #f8fafc;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      font-size: 1rem;
    }

    .teacher-panel-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .teacher-title {
      font-weight: 800;
      font-size: 1.1rem;
      color: #e0e7ff;
    }

    .teacher-overview-box {
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(129, 140, 248, 0.45);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 10px 0 14px;
      color: #f1f5f9;
      line-height: 1.55;
    }

    .teacher-nav-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .teacher-stage-btn {
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 6px 11px;
      font-size: 0.85rem;
      border-radius: 8px;
      font-weight: 700;
    }

    .teacher-stage-btn.active {
      background: #6366f1;
      border-color: #a5b4fc;
      color: #ffffff;
    }

    .teacher-action-btn {
      background: #312e81;
      color: #e0e7ff;
      border: 1px solid #818cf8;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    /* Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }

    h1, h2, h3 {
      margin-top: 0;
      line-height: 1.3;
    }

    h1 {
      font-size: 1.75rem;
      color: var(--accent);
    }

    h2 {
      font-size: 1.42rem;
      color: var(--text-heading);
    }

    h3 {
      font-size: 1.15rem;
      color: var(--accent);
    }

    .tag {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .tag-e {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green);
    }

    .tag-ca {
      background: var(--purple-bg);
      color: var(--purple);
      border: 1px solid var(--purple);
    }

    .tag-pair {
      background: var(--blue-bg);
      color: var(--blue);
      border: 1px solid var(--blue);
    }

    /* Key Words Box */
    .vocab-box {
      background-color: var(--blue-bg);
      border-left: 5px solid var(--blue);
      border-radius: 10px;
      padding: 14px 18px;
      margin: 14px 0 20px;
    }

    .vocab-box-title {
      font-weight: 800;
      color: var(--blue);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .vocab-box ul {
      margin: 6px 0 0 0;
      padding-left: 20px;
    }

    .vocab-box li {
      margin-bottom: 5px;
    }

    /* Stacked Completed Answers */
    .history-stack {
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-header {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }

    .completed-card {
      background-color: var(--bg-completed);
      border: 1px solid var(--border);
      border-left: 5px solid var(--green);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .completed-q {
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .completed-a {
      background-color: var(--green-bg);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .completed-exp {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .active-question-box {
      background-color: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 20px;
      margin-top: 8px;
    }

    /* Tap-to-Fill Sentence Builder */
    .sentence-builder {
      background-color: var(--bg-card-alt);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      font-size: 1.16rem;
      font-weight: 600;
      line-height: 2.1;
      margin: 14px 0;
    }

    .blank-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 125px;
      padding: 2px 12px;
      margin: 0 4px;
      border-radius: 8px;
      border: 2px dashed var(--accent);
      background-color: var(--bg-card);
      color: var(--accent);
      font-weight: 800;
      cursor: pointer;
      vertical-align: baseline;
    }

    .blank-slot.filled {
      border-style: solid;
      background-color: var(--blue-bg);
      border-color: var(--blue);
      color: var(--blue);
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    .word-chip {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 2px solid var(--border);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .word-chip:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .word-chip.used {
      opacity: 0.4;
      cursor: default;
    }

    /* Cooldown Banner */
    .cooldown-banner {
      background-color: var(--red-bg);
      border: 1px solid var(--red);
      color: var(--red);
      font-weight: 800;
      padding: 10px 14px;
      border-radius: 10px;
      margin-top: 12px;
      text-align: center;
    }

    /* Data Table */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      background-color: var(--bg-card-alt);
      border-radius: 10px;
      overflow: hidden;
    }

    .data-table th, .data-table td {
      border: 1px solid var(--border);
      padding: 12px 14px;
      text-align: left;
    }

    .data-table th {
      background-color: var(--blue-bg);
      color: var(--blue);
      font-weight: 800;
    }

    /* Buttons */
    button {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 10px;
      border: none;
      padding: 12px 18px;
      transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--accent-text);
      font-size: 1.08rem;
      padding: 14px 24px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-tts {
      background-color: var(--blue-bg);
      color: var(--blue);
      border: 1px solid var(--blue);
      padding: 7px 13px;
      font-size: 0.92rem;
      flex-shrink: 0;
    }

    .btn-tts:hover {
      filter: brightness(0.95);
    }

    .btn-tts.speaking {
      background-color: var(--blue);
      color: #ffffff;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(3, 105, 161, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(3, 105, 161, 0); }
      100% { box-shadow: 0 0 0 0 rgba(3, 105, 161, 0); }
    }

    /* Inputs & Starter Chips */
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    input[type="text"], textarea, select {
      width: 100%;
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .no-paste-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-card-alt);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .starter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .chip-btn {
      background-color: var(--bg-card);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 12px;
      font-size: 0.9rem;
      border-radius: 8px;
    }

    .chip-btn:hover {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    /* Choice Options */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    @media (min-width: 700px) {
      .options-grid.two-col {
        grid-template-columns: 1fr 1fr;
      }
    }

    .option-btn {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 2px solid var(--border);
      text-align: left;
      justify-content: flex-start;
      padding: 15px 18px;
      font-weight: 600;
      line-height: 1.45;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .option-btn.selected {
      border-color: var(--blue);
      background-color: var(--blue-bg);
    }

    .option-btn.correct {
      border-color: var(--green);
      background-color: var(--green-bg);
      color: var(--text-main);
    }

    .option-btn.wrong {
      border-color: var(--red);
      background-color: var(--red-bg);
      color: var(--text-main);
    }

    /* Group Builder Cards */
    .group-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin: 16px 0;
    }

    @media (min-width: 740px) {
      .group-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .group-box {
      background-color: var(--bg-card-alt);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .group-box.treat {
      border-top: 5px solid var(--green);
    }

    .group-box.ctrl {
      border-top: 5px solid var(--accent);
    }

    /* Feedback Box */
    .feedback-box {
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 10px;
      border-left: 5px solid var(--blue);
      background-color: var(--bg-card-alt);
      display: none;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.ok {
      border-left-color: var(--green);
      background-color: var(--green-bg);
    }

    .feedback-box.err {
      border-left-color: var(--red);
      background-color: var(--red-bg);
    }

    /* Pair Discussion Box */
    .pair-box {
      background-color: var(--bg-card-alt);
      border: 2px solid var(--blue);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 18px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 10px;
      margin: 10px 0;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      width: 24px;
      height: 24px;
      accent-color: var(--green);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Oral Timer */
    .timer-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-card-alt);
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    /* Toast Warning */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #991b1b;
      color: #ffffff;
      border: 2px solid #f87171;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      z-index: 9999;
      display: none;
      max-width: 90vw;
      text-align: center;
    }

    .nav-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .summary-textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      min-height: 360px;
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 2px solid var(--green);
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="brand-badge">Lektion 3 av 3</span>
      <span>Bygglabbet: Källkritik & Slutgenrep</span>
    </div>
    <div class="top-controls">
      <div class="level-switch" role="group" aria-label="Välj svårighetsnivå">
        <button type="button" class="level-btn active-e" id="btnModeE" onclick="setLevelMode('E')">
          🟢 E-nivå
        </button>
        <button type="button" class="level-btn" id="btnModeCA" onclick="setLevelMode('CA')">
          🟣 C/A-nivå
        </button>
      </div>
      <select id="voiceSelect" class="voice-select" title="Välj röst för uppläsning" onchange="selectVoice(this.value)">
        <option value="">🗣️ Laddar röster...</option>
      </select>
      <button type="button" class="btn-tts" id="btnAutoTts" onclick="toggleAutoTts()">
        🔊 Auto-ljud: AV
      </button>
      <button type="button" class="btn-secondary" style="padding: 7px 10px; font-size: 0.88rem;" onclick="stopSpeech()">
        ⏹ Stopp
      </button>
      <button type="button" class="btn-secondary" id="btnTheme" style="padding: 7px 10px; font-size: 0.88rem;" onclick="toggleTheme()">
        🌙 Mörkt läge
      </button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="stageLabel">Start: Par-incheckning</span>
      <span id="timeEstimate">Ca 40 min totalt</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>
</header>

<main id="appContainer"></main>

<div id="toast"></div>

<script>
/* =========================================================
   1. NATURAL SWEDISH TEXT-TO-SPEECH (CHROMEBOOK OPTIMIZED)
   ========================================================= */
let availableSvVoices = [];
let selectedVoiceURI = '';
let autoTts = false;
let currentSpeakBtn = null;
let speechQueue = [];
let isSpeakingQueue = false;

function scoreSwedishVoice(voice) {
  const name = (voice.name || '').toLowerCase();
  const lang = (voice.lang || '').toLowerCase();
  let score = 0;

  if (lang === 'sv-se') score += 40;
  else if (lang.startsWith('sv')) score += 20;

  if (name.includes('google')) score += 100;
  if (name.includes('natural') || name.includes('neural') || name.includes('online')) score += 90;
  if (name.includes('alva') || name.includes('klara') || name.includes('oskar') || name.includes('sofie') || name.includes('mattias')) score += 70;
  if (!voice.localService) score += 30;

  if (name.includes('espeak') || name.includes('compact') || name.includes('android')) score -= 60;

  return score;
}

function loadSwedishVoices() {
  if (!('speechSynthesis' in window)) return;
  const allVoices = window.speechSynthesis.getVoices();
  if (!allVoices || allVoices.length === 0) return;

  const svVoices = allVoices
    .filter(v => (v.lang || '').toLowerCase().startsWith('sv'))
    .sort((a, b) => scoreSwedishVoice(b) - scoreSwedishVoice(a));

  availableSvVoices = svVoices;

  const selectEl = document.getElementById('voiceSelect');
  if (!selectEl) return;

  if (svVoices.length === 0) {
    selectEl.innerHTML = `<option value="">🗣️ Standardröst</option>`;
    return;
  }

  if (!selectedVoiceURI || !svVoices.some(v => v.voiceURI === selectedVoiceURI)) {
    selectedVoiceURI = svVoices[0].voiceURI;
  }

  selectEl.innerHTML = svVoices.map((v, i) => {
    const cleanName = v.name
      .replace(/Microsoft |Google |Desktop |\(Sweden\)|Swedish/gi, '')
      .trim() || `Svensk röst ${i + 1}`;
    const tag = i === 0 ? ' ⭐' : '';
    return `<option value="${escapeHtml(v.voiceURI)}" ${v.voiceURI === selectedVoiceURI ? 'selected' : ''}>🗣️ ${escapeHtml(cleanName)}${tag}</option>`;
  }).join('');
}

function selectVoice(uri) {
  selectedVoiceURI = uri;
  speakText("Hej! Så här låter den här rösten.");
}

if ('speechSynthesis' in window) {
  loadSwedishVoices();
  window.speechSynthesis.onvoiceschanged = loadSwedishVoices;
}

function stopSpeech() {
  speechQueue = [];
  isSpeakingQueue = false;
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  if (currentSpeakBtn) {
    currentSpeakBtn.classList.remove('speaking');
    currentSpeakBtn = null;
  }
}

function splitIntoSentences(text) {
  const clean = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  if (!clean) return [];
  return clean.match(/[^.!?]+[.!?]+|[^.!?]+$/g).map(s => s.trim()).filter(Boolean);
}

function speakNextInQueue() {
  if (speechQueue.length === 0) {
    isSpeakingQueue = false;
    if (currentSpeakBtn) {
      currentSpeakBtn.classList.remove('speaking');
      currentSpeakBtn = null;
    }
    return;
  }

  const sentence = speechQueue.shift();
  const utterance = new SpeechSynthesisUtterance(sentence);
  utterance.lang = 'sv-SE';

  const chosenVoice = availableSvVoices.find(v => v.voiceURI === selectedVoiceURI) || availableSvVoices[0];
  if (chosenVoice) {
    utterance.voice = chosenVoice;
  }

  utterance.rate = 0.94;
  utterance.pitch = 1.02;

  utterance.onend = () => {
    if (isSpeakingQueue) {
      setTimeout(speakNextInQueue, 120);
    }
  };
  utterance.onerror = () => {
    stopSpeech();
  };

  window.speechSynthesis.speak(utterance);
}

function speakText(text, btnEl = null) {
  if (!('speechSynthesis' in window)) {
    showToast("Din webbläsare stöder tyvärr inte uppläsning.");
    return;
  }
  stopSpeech();
  loadSwedishVoices();

  const sentences = splitIntoSentences(text);
  if (sentences.length === 0) return;

  if (btnEl) {
    currentSpeakBtn = btnEl;
    btnEl.classList.add('speaking');
  }

  speechQueue = sentences;
  isSpeakingQueue = true;
  speakNextInQueue();
}

function speakFromBtn(btnEl) {
  const text = btnEl.getAttribute('data-tts') || '';
  speakText(text, btnEl);
}

function toggleAutoTts() {
  autoTts = !autoTts;
  const btn = document.getElementById('btnAutoTts');
  btn.textContent = autoTts ? '🔊 Auto-ljud: PÅ' : '🔊 Auto-ljud: AV';
  if (autoTts) {
    speakText("Automatisk uppläsning är nu på.");
  } else {
    stopSpeech();
  }
}

function ttsButton(textToRead, label = "Lyssna") {
  return `<button type="button" class="btn-tts" data-tts="${escapeHtml(textToRead)}" onclick="speakFromBtn(this)">🔊 ${escapeHtml(label)}</button>`;
}

function setLevelMode(mode) {
  if (state.levelMode === mode) return;
  state.levelMode = mode;
  cooldownSeconds = 0;
  clearInterval(cooldownTimer);
  updateLevelButtons();
  showToast(
    mode === 'E'

      : "🟣 C/A-nivå vald: fullständiga scenarier och fördjupad analys.",

function updateLevelButtons() {
  const btnE = document.getElementById('btnModeE');
  const btnCA = document.getElementById('btnModeCA');
  if (!btnE || !btnCA) return;
  btnE.className = state.levelMode === 'E' ? 'level-btn active-e' : 'level-btn';
  btnCA.className = state.levelMode === 'CA' ? 'level-btn active-ca' : 'level-btn';
}

function triggerClickCooldown(hintMessage) {
  showToast(hintMessage);
  if (state.levelMode !== 'E') return;
  cooldownSeconds = 3;
  clearInterval(cooldownTimer);
  render();
  cooldownTimer = setInterval(() => {
    cooldownSeconds--;
    if (cooldownSeconds <= 0) {
      cooldownSeconds = 0;
      clearInterval(cooldownTimer);
    }
    render();
  }, 1000);
}

/* =========================================================
   3. ANTI-PASTE & TOAST GUARDRAILS
   ========================================================= */
let toastTimeout = null;
function showToast(msg, isSuccess = false) {
  const el = document.getElementById('toast');
  el.style.backgroundColor = isSuccess ? '#14532d' : '#991b1b';
  el.style.borderColor = isSuccess ? '#22c55e' : '#f87171';
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    el.style.display = 'none';
  }, 3600);
}

function attachAntiPaste(el) {
  if (!el) return;
  el.addEventListener('paste', (e) => {
    e.preventDefault();
    showToast("🚫 Klistra in är avstängt! Skriv svaret med era egna ord.");
  });
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    showToast("🚫 Dra-och-släpp text är avstängt! Skriv med egna ord.");
  });

  let lastVal = el.value || '';
  el.addEventListener('input', () => {
    const diff = el.value.length - lastVal.length;
    if (diff > 18) {
      el.value = lastVal;
      showToast("🚫 För många tecken på en gång! Skriv svaret själva.");
    } else {
      lastVal = el.value;
    }
  });
}

function wireAllNoPasteInputs() {
  document.querySelectorAll('.no-paste').forEach(attachAntiPaste);
}

function insertStarter(textareaId, starterText) {
  const el = document.getElementById(textareaId);
  if (!el) return;
  el.value = starterText;
  el.focus();
  el.dispatchEvent(new Event('input'));
}

document.addEventListener('keydown', (e) => {
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) {
    return;
  }
  if (e.ctrlKey || e.altKey || e.metaKey) return;

  if (e.shiftKey && (e.code === 'KeyL' || e.key === 'L' || e.key === 'l')) {
    e.preventDefault();
    toggleTeacherMode();
  } else if (e.shiftKey && (e.code === 'KeyF' || e.key === 'F' || e.key === 'f')) {
    e.preventDefault();
    demoForwardStep();
  }
});

function toggleTeacherMode() {
  state.teacherMode = !state.teacherMode;
  if (state.teacherMode) {
    state.teacherOverviewExpanded = true;
    showToast("📋 Lektionsöversikt visad för genomgång!", true);
  } else {
    showToast("Lektionsöversikt stängd.");
  }
  render();
}

function jumpToStage(targetStage) {
  if (!state.student1) state.student1 = "Exempel-Elev 1";
  if (!state.student2) state.student2 = "Exempel-Elev 2";
  state.stage = targetStage;
  render();
}

function demoForwardStep() {
  if (!state.student1) state.student1 = "Exempel-Elev 1";
  if (!state.student2) state.student2 = "Exempel-Elev 2";
  const isCA = state.levelMode === 'CA';
  cooldownSeconds = 0;
  clearInterval(cooldownTimer);

  if (state.stage === 0) {
    if (!state.classGroup) state.classGroup = "BA23A";
    state.stage = 1;
    render();
    return;
  }

  if (state.stage === 1) {
    const qList = isCA ? s1CasesCA : s1StepsE;
    if (state.s1Index < qList.length) {
      if (!isCA) {
        const step = qList[state.s1Index];
        if (step.type === 'fill') {
          state.s1FillSlots = [...step.answers];
          checkS1Fill();
        } else {
          const correctIdx = step.options.findIndex(o => o.correct);
          answerS1E(correctIdx);
        }
      } else {
        if (!state.s1Answered) {
          const correctIdx = s1CasesCA[state.s1Index].options.findIndex(o => o.correct);
          answerS1CA(correctIdx);
        } else {
          nextS1CA();
        }
      }
    } else {
      if (!state.pair1Text || state.pair1Text.length < 15) {
        state.pair1Text = "Man bör kolla vem som ligger bakom påståendet (intressekonflikter), om det finns en riktig studie med kontrollgrupp och om oberoende forskare har granskat resultatet.";
      }
      state.pair1PeerChecks = [true, true];
      state.stage = 2;
      render();
    }
    return;
  }

  if (state.stage === 2) {
    if (!isCA) {
      if (state.s2Index < s2StepsE.length) {
        const step = s2StepsE[state.s2Index];
        if (step.type === 'fill') {
          state.s2FillSlots = [...step.answers];
          checkS2Fill();
        } else {
          const correctIdx = step.options.findIndex(o => o.correct);
          answerS2E(correctIdx);
        }
      } else {
        state.stage = 3;
        render();
      }
    } else {
      if (!state.s2DefCorrect) {
        answerS2DefCA(true);
      } else if (state.s2CaseIndex < s2CasesCA.length) {
        if (!state.s2CaseAnswered) {
          const correctIdx = s2CasesCA[state.s2CaseIndex].options.findIndex(o => o.correct);
          answerS2CaseCA(correctIdx);
        } else if (state.s2CaseIndex < s2CasesCA.length - 1) {
          state.s2CaseIndex++;
          state.s2CaseAnswered = false;
          state.s2CaseChosenIdx = null;
          render();
        } else if (!state.s2WhyCorrect) {
          answerS2WhyCA(true);
        } else {
          state.stage = 3;
          render();
        }
      }
    }
    return;
  }

  if (state.stage === 3) {
    if (!isCA && state.s3Index < s3StepsE.length) {
      const step = s3StepsE[state.s3Index];
      if (step.type === 'fill') {
        state.s3FillSlots = [...step.answers];
        checkS3Fill();
      } else {
        const correctIdx = step.options.findIndex(o => o.correct);
        answerS3E(correctIdx);
      }
    } else if (isCA && (!state.s3Fix1Done || !state.s3Fix2Done)) {
      state.s3Fix1Done = true;
      state.s3Fix2Done = true;
      render();
    } else {
      if (!state.conc1Text || state.conc1Text.length < 15) {
        state.conc1Text = "Resultatet visar att den nya skruvdragaren minskade upplevd trötthet i handleden hos de 20 snickarna under två veckor, men byggtempot var nästan likadant.";
      }
      if (!state.conc2Text || state.conc2Text.length < 15) {
        state.conc2Text = "En felkälla är att snickarna visste vilken maskin som var ny (placebo) och att vi bara testade i två veckor på gips.";
      }
      state.pair2PeerChecks = [true, true];
      state.stage = 4;
      render();
    }
    return;
  }

  if (state.stage === 4) {
    if (!isCA) {
      const sb = studyBuilderE[state.selectedStudy];
      state.studyGood = sb.steps[0].options.find(o => o.correct).text;
      state.studyFlaw = sb.steps[1].options.find(o => o.correct).text;
      state.studyImprove = sb.steps[2].options.find(o => o.correct).text;
      if (!state.studyWhyText || state.studyWhyText.length < 15) {
        state.studyWhyText = sb.demoWhy;
      }
      state.studyPeerChecks = [true, true];
      state.stage = 5;
      render();
    } else {
      const sc = studyConfigsCA[state.selectedStudy];
      if (!state.studyGood || !state.studyFlaw || !state.studyImprove) {
        state.studyGood = sc.goodOptions[0];
        state.studyFlaw = sc.flawOptions[0];
        state.studyImprove = sc.improveOptions[0];
        render();
      } else {
        if (!state.studyWhyText || state.studyWhyText.length < 15) {
          state.studyWhyText = sc.demoWhy;
        }
        state.stage = 5;
        render();
      }
    }
    return;
  }

  if (state.stage === 5) {
    if (!state.s5Revealed) {
      state.s5OralChecks = [true, true];
      revealOral();
    } else {
      rateOral('green');
    }
    return;
  }

  if (state.stage === 6) {
    if (!state.caCorrCorrect) {
      answerCaCorr(true);
    } else {
      if (!state.caText || state.caText.length < 10) {
        state.caText = "Ett samband betyder bara att två saker förekommer samtidigt, medan ett orsakssamband kräver ett kontrollerat experiment där man ser att A faktiskt orsakar B.";
      }
      state.didBonus = true;
      state.stage = 7;
      render();
    }
    return;
  }

  if (state.stage === 7) {
    showToast("Ni är redan på sista sidan (Sammanfattning)!", true);
  }
}

            Idag jobbar ni i <strong>par</strong> och knyter ihop hela momentet <em>Naturvetenskapligt arbetssätt & källkritik</em> inför det muntliga provet i <em>Naturkunskap 1a1</em>:
          </p>
          <ul style="margin: 6px 0; padding-left: 20px;">
            <li><strong>Etapp 1 – Reklam- & mytgranskaren (~8 min):</strong> Granska 4 påståenden från sociala medier, reklam och rubriker + bygg regeln + <em>Par-snack #1</em>.</li>
            <li><strong>Etapp 2 – Vetenskap vs. Reklam & Samband (~8 min):</strong> Träna på oberoende granskning, intressekonflikter och skillnaden mellan samband och orsak.</li>
            <li><strong>Etapp 3 – Slutsats- & felkälle-verkstaden (~8 min):</strong> Öva på att dra rimliga slutsatser utan att överdriva och tolka mättabell + <em>Par-snack #2</em>.</li>
            <li><strong>Etapp 4 – Granska & förbättra en undersökning (~7 min):</strong> Analysera en hel arbetsplatsstudie (styrkor, felkällor och hur man höjer pålitligheten).</li>
            <li><strong>Etapp 5 – Stora muntliga slutgenrepet + Etapp 6 C/A:</strong> Öva högt på 5 sammanfattande provfrågor med timer och checklista (samt samband & orsak).</li>
          </ul>
        </div>
      ` : ''}

      <div style="font-size: 0.85rem; color: #c7d2fe; font-weight: 700;">Hoppa till en etapp:</div>
      <div class="teacher-nav-grid">
        ${stageMeta.map((m, idx) => `
          <button type="button" class="teacher-stage-btn ${state.stage === idx ? 'active' : ''}" onclick="jumpToStage(${idx})">
            ${escapeHtml(m.short)}
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

/* =========================================================
   6. RENDERING FUNCTIONS
   ========================================================= */
function updateHeader() {
  const meta = stageMeta[state.stage] || stageMeta[0];
  document.getElementById('stageLabel').textContent = meta.name;
  document.getElementById('timeEstimate').textContent = meta.time;
  document.getElementById('progressBar').style.width = meta.pct + '%';
  updateLevelButtons();
}

function render() {
  stopSpeech();
  clearInterval(oralInterval);
  state.s5TimerRunning = false;
  updateHeader();

  const container = document.getElementById('appContainer');
  let html = renderTeacherBanner();

  if (state.stage === 0) html += renderStart();
  else if (state.stage === 1) html += renderStage1();
  else if (state.stage === 2) html += renderStage2();
  else if (state.stage === 3) html += renderStage3();
  else if (state.stage === 4) html += renderStage4();
  else if (state.stage === 5) html += renderStage5();
  else if (state.stage === 6) html += renderStage6();
  else if (state.stage === 7) html += renderSummary();

  container.innerHTML = html;
  wireAllNoPasteInputs();

  if (autoTts) {
    const autoTarget = document.querySelector('[data-autoread]');
    if (autoTarget) {
      setTimeout(() => speakText(autoTarget.getAttribute('data-autoread')), 250);
    }
  }
}

            ${ttsButton(fullAudio, "Lyssna")}
          </div>

          <div class="sentence-builder">
            ${escapeHtml(step.parts[0])}

            ${escapeHtml(step.parts[1])}
            <span class="blank-slot ${slot1 ? 'filled' : ''}" onclick="clearS1Slot(1)">
              ${slot1 ? escapeHtml(slot1) : '2. [ Välj ord ]'}
            </span>
            ${escapeHtml(step.parts[2])}

          <div class="word-bank">

              const isUsed = state.s1FillSlots.includes(word);

                </button>
              `;
            }).join('')}
          </div>

          <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top: 10px;">
            <button type="button" class="btn-primary" ${!slot0 || !slot1 || cooldownSeconds > 0 ? 'disabled' : ''} onclick="checkS1Fill()">
              Kontrollera meningen ✓
            </button>
            <button type="button" class="btn-secondary" onclick="state.s1FillSlots = [null, null]; render();">
              Rensa luckor
            </button>
          </div>
          ${cooldownSeconds > 0 ? `<div class="cooldown-banner">⏳ Tänk efter i ${cooldownSeconds} sek...</div>` : ''}
        </div>
      `;
    } else {
      const fullAudio = `${step.title}. ${step.scenario}. ${step.prompt}. ${step.options.map((o, i) => `Alternativ ${i + 1}: ${o.text}`).join('. ')}.`;
      currentPartHtml = `
        <div class="active-question-box">
          <div class="card-header-row">
            <div>
              <span class="tag tag-e">E-nivå • ${escapeHtml(step.badge)}</span>
              <h3 style="margin: 4px 0 0 0;">${escapeHtml(step.title)}</h3>
            </div>
            ${ttsButton(fullAudio, "Lyssna")}
          </div>

          <div style="background: var(--bg-card-alt); border-left: 5px solid var(--accent); padding: 14px 16px; border-radius: 10px; margin: 12px 0;" data-autoread="${escapeHtml(fullAudio)}">
            ${escapeHtml(step.scenario)}
          </div>

          <p style="font-weight: 700; font-size: 1.1rem;">${escapeHtml(step.prompt)}</p>

          <div class="options-grid">
            ${step.options.map((opt, idx) => `
              <button type="button" class="option-btn" ${disabledAttr} onclick="answerS1E(${idx})">
                ${escapeHtml(opt.text)}
              </button>
            `).join('')}
          </div>
          ${cooldownSeconds > 0 ? `<div class="cooldown-banner">⏳ Läs alternativen noga! Ni kan välja igen om ${cooldownSeconds} sek...</div>` : ''}
        </div>
      `;
    }
  } else {
    const pairPrompt = "Par-snack 1: Turas om att berätta högt för varandra. Vad ska man kolla innan man litar på ett påstående om att något är vetenskapligt bevisat? Kryssa i nyckelorden och skriv er korta sammanfattning.";
    currentPartHtml = `
      <div class="pair-box">
        <div class="card-header-row">
          <div>
            <span class="tag tag-pair">🗣️ Par-snack #1 • Muntlig kompis-check</span>
            <h3>Sammanfatta högt – kompisen checkar nyckelorden!</h3>
          </div>
          ${ttsButton(pairPrompt, "Lyssna")}
        </div>
        <p data-autoread="${escapeHtml(pairPrompt)}">

        </p>

        <div style="margin: 12px 0;">
          <strong>✅ Kompis-check (kryssa i när ni hört varandra säga detta högt):</strong>
          <label class="checkbox-row">
            <input type="checkbox" id="chkPair1A" ${state.pair1PeerChecks[0] ? 'checked' : ''} onchange="state.pair1PeerChecks[0] = this.checked" />

          </label>
          <label class="checkbox-row">
            <input type="checkbox" id="chkPair1B" ${state.pair1PeerChecks[1] ? 'checked' : ''} onchange="state.pair1PeerChecks[1] = this.checked" />
            <span>Kompisen sa att det måste finnas en <strong>kontrollgrupp</strong> och <strong>oberoende granskning</strong>.</span>
          </label>
        </div>

        <div class="no-paste-badge">🚫 Klistra in är avstängt – skriv med era egna ord</div>

        <div class="starter-chips">
          <button type="button" class="chip-btn" onclick="insertStarter('txtPair1', 'För att avgöra om ett påstående går att lita på kollar vi ')">

          </button>
        </div>
        <textarea id="txtPair1" class="no-paste" rows="3" placeholder="För att avgöra om ett påstående går att lita på kollar vi...">${escapeHtml(state.pair1Text)}</textarea>

      </div>

      <div class="vocab-box">
        <div class="vocab-box-title">
          <span>🔑 Nyckelord i Etapp 1</span>
          ${ttsButton(vocabAudio, "Lyssna")}
        </div>
        <ul>
          <li><strong>Källkritisk check:</strong> Har testet en <strong>kontrollgrupp</strong>? Granskas det av <strong>oberoende forskare</strong>? Har säljaren en <strong>intressekonflikt</strong>? Vad säger <strong>ursprungskällan</strong>?</li>
        </ul>
      </div>

      ${historyHtml}
      ${currentPartHtml}
    </div>
  `;
}

function pickS1Word(word) {
  if (state.s1FillSlots[0] === null) state.s1FillSlots[0] = word;
  else if (state.s1FillSlots[1] === null) state.s1FillSlots[1] = word;
  render();
}

function clearS1Slot(idx) {
  state.s1FillSlots[idx] = null;
  render();
}

function checkS1Fill() {
  const step = s1StepsE[state.s1Index];
  if (!step || step.type !== 'fill') return;
  if (state.s1FillSlots[0] !== step.answers[0] || state.s1FillSlots[1] !== step.answers[1]) {
    state.s1FillSlots = [null, null];
    triggerClickCooldown("Inte riktigt! Titta i den blå rutan och välj rätt två ord.");
    return;
  }
  state.s1Score++;
  state.s1History.push({
    prompt: step.completedQ,
    chosenText: step.completedA,
    explanation: step.explanation
  });
  state.s1FillSlots = [null, null];
  state.s1Index++;
  render();
  if (autoTts) speakText("Rätt! " + step.explanation);
}

function answerS1E(idx) {
  if (cooldownSeconds > 0) return;
  const step = s1StepsE[state.s1Index];
  const chosen = step.options[idx];
  if (!chosen.correct) {
    triggerClickCooldown(chosen.trap || "Inte riktigt! Läs alternativen noga.");
    return;
  }
  state.s1Score++;
  state.s1History.push({
    prompt: `${step.title}: ${step.prompt}`,
    chosenText: chosen.text,
    explanation: step.explanation
  });
  state.s1Index++;
  render();
  if (autoTts) speakText("Rätt! " + step.explanation);
}

function resetStage1() {
  state.s1Index = 0;
  state.s1Score = 0;
  state.s1History = [];
  state.s1FillSlots = [null, null];
  state.s1Answered = false;
  state.s1ChosenIdx = null;
  render();
}

/* C/A Stage 1 (Original intact) */
function renderStage1CA() {
  if (state.s1Index < s1CasesCA.length) {
    const c = s1CasesCA[state.s1Index];
    const fullAudio = `${c.title}. ${c.scenario}. ${c.question}. Alternativ 1: ${c.options[0].text}. Alternativ 2: ${c.options[1].text}. Alternativ 3: ${c.options[2].text}.`;

    let optsHtml = '';
    c.options.forEach((opt, idx) => {
      let cls = 'option-btn';
      if (state.s1Answered) {
        if (opt.correct) cls += ' correct';
        else if (state.s1ChosenIdx === idx) cls += ' wrong';
      }
      optsHtml += `
        <button type="button" class="${cls}" ${state.s1Answered ? 'disabled' : ''} onclick="answerS1CA(${idx})">
          ${escapeHtml(opt.text)}
        </button>
      `;
    });

    const isLast = state.s1Index === s1CasesCA.length - 1;
    const isCorrect = state.s1Answered && c.options[state.s1ChosenIdx]?.correct;

    return `
      <div class="card">
        <div class="card-header-row">
          <div>
            <span class="tag tag-ca">🟣 C/A-nivå • ${c.badge}</span>
            <h2>Reklam- & mytgranskaren: ${escapeHtml(c.title)}</h2>
          </div>
          ${ttsButton(fullAudio, "Lyssna")}
        </div>

        <div style="background: var(--bg-card-alt); border-left: 5px solid var(--accent); padding: 18px; border-radius: 10px; margin: 14px 0;" data-autoread="${escapeHtml(fullAudio)}">
          ${escapeHtml(c.scenario)}
        </div>

        <p style="font-weight: 700; font-size: 1.1rem;">${escapeHtml(c.question)}</p>

        <div class="options-grid">
          ${optsHtml}
        </div>

        <div class="feedback-box ${state.s1Answered ? 'show ' + (isCorrect ? 'ok' : 'err') : ''}">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
            <div>
              <strong>${isCorrect ? '✅ Bra genomskådat!' : '💡 Kolla vad som brister källkritiskt:'}</strong><br/>
              ${escapeHtml(c.explanation)}
            </div>
            ${ttsButton(c.explanation, "Lyssna")}
          </div>
        </div>

        <div class="nav-footer">
          <span style="color: var(--text-muted);">Poäng i etappen: ${state.s1Score} / ${s1CasesCA.length}</span>
          ${state.s1Answered ? `
            <button type="button" class="btn-primary" onclick="nextS1CA()">
              ${isLast ? 'Till Par-snack #1 →' : 'Nästa fall →'}
            </button>
          ` : ''}
        </div>
      </div>
    `;
  } else {
    const pairPrompt = "Par-snack 1: Turas om att berätta högt för varandra. Vilka kontrollfrågor ska man ställa när reklam eller en tidning påstår att något är vetenskapligt bevisat? Skriv sedan ner er sammanfattning.";
    return `
      <div class="card">
        <div class="card-header-row">
          <div>
            <span class="tag tag-pair">🗣️ Par-snack #1 • Källkritiska glasögon</span>
            <h2>Sammanfatta högt för varandra!</h2>
          </div>
          ${ttsButton(pairPrompt, "Lyssna")}
        </div>
        <p data-autoread="${escapeHtml(pairPrompt)}">
          Utifrån de fyra fallen ni nyss granskade: berätta högt för varandra vad man ska kolla innan man litar på ett påstående om att något ”funkar” eller är ”vetenskapligt bevisat”.
        </p>

        <div class="pair-box">
          <div class="no-paste-badge">🚫 Klistra in är avstängt – skriv med era egna ord</div>
          <label for="txtPair1">Skriv ner minst två saker ni kollar för att avgöra om ett påstående är trovärdigt:</label>
          <textarea id="txtPair1" class="no-paste" rows="3" placeholder="För att avgöra om ett påstående går att lita på bör man kolla...">${escapeHtml(state.pair1Text)}</textarea>

          <label class="checkbox-row">
            <input type="checkbox" id="chkPair1A" ${state.pair1PeerChecks[0] ? 'checked' : ''} onchange="state.pair1PeerChecks[0] = this.checked" />
            <span>Vi har pratat igenom svaret högt med varandra!</span>
          </label>
        </div>

        <div class="nav-footer">
          <button type="button" class="btn-secondary" onclick="resetStage1()">← Gör om fallen</button>
          <button type="button" class="btn-primary" onclick="finishStage1()">Vidare till Etapp 2 →</button>
        </div>
      </div>
    `;
  }
}

function answerS1CA(idx) {
  if (state.s1Answered) return;
  state.s1Answered = true;
  state.s1ChosenIdx = idx;
  if (s1CasesCA[state.s1Index].options[idx].correct) {
    state.s1Score++;
  }
  render();
  if (autoTts) speakText(s1CasesCA[state.s1Index].explanation);
}

function nextS1CA() {
  state.s1Index++;
  state.s1Answered = false;
  state.s1ChosenIdx = null;
  render();
}

function finishStage1() {
  const isCA = state.levelMode === 'CA';
  const txt = document.getElementById('txtPair1').value.trim();
  const c1 = document.getElementById('chkPair1A').checked;
  const c2El = document.getElementById('chkPair1B');
  const c2 = c2El ? c2El.checked : true;

  if (!c1 || !c2) {
    showToast("Kryssa i kompis-checken när ni har pratat igenom svaret högt!");
    return;
  }
  if (txt.length < 15) {
    showToast("Skriv minst en mening i rutan innan ni går vidare!");
    return;
  }
  state.pair1Text = txt;
  state.pair1PeerChecks = [c1, c2];
  state.stage = 2;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

/* --- STAGE 2: VETENSKAP VS REKLAM & SAMBAND VS ORSAK --- */
function renderStage2() {
  const isCA = state.levelMode === 'CA';

function pickS2Word(word) {
  if (state.s2FillSlots[0] === null) state.s2FillSlots[0] = word;
  else if (state.s2FillSlots[1] === null) state.s2FillSlots[1] = word;
  render();
}

function clearS2Slot(idx) {
  state.s2FillSlots[idx] = null;
  render();
}

function checkS2Fill() {
  const step = s2StepsE[state.s2Index];
  if (!step || step.type !== 'fill') return;
  if (state.s2FillSlots[0] !== step.answers[0] || state.s2FillSlots[1] !== step.answers[1]) {
    state.s2FillSlots = [null, null];
    triggerClickCooldown("Inte riktigt! Titta i den blå rutan och välj rätt ord.");
    return;
  }
  state.s2Score++;
  state.s2History.push({
    prompt: step.completedQ,
    chosenText: step.completedA,
    explanation: step.explanation
  });
  state.s2FillSlots = [null, null];
  state.s2Index++;
  render();
  if (autoTts) speakText("Rätt! " + step.explanation);
}

function answerS2E(idx) {
  if (cooldownSeconds > 0) return;
  const step = s2StepsE[state.s2Index];
  const chosen = step.options[idx];
  if (!chosen.correct) {
    triggerClickCooldown(chosen.trap || "Inte riktigt! Läs alternativen noga.");
    return;
  }
  state.s2Score++;
  state.s2History.push({
    prompt: step.prompt,
    chosenText: chosen.text,
    explanation: step.explanation
  });
  state.s2Index++;
  render();
  if (autoTts) speakText("Rätt! " + step.explanation);
}

  state.stage = 3;

  if (state.s3FillSlots[0] !== step.answers[0] || state.s3FillSlots[1] !== step.answers[1]) {
    state.s3FillSlots = [null, null];
    triggerClickCooldown("Inte riktigt! Titta i den blå rutan och välj rätt ord.");
    return;
  }
  state.s3Score++;
  state.s3History.push({
    prompt: step.completedQ,
    chosenText: step.completedA,
    explanation: step.explanation
  });
  state.s3FillSlots = [null, null];
  state.s3Index++;
  render();
  if (autoTts) speakText("Rätt! " + step.explanation);
}

function answerS3E(idx) {
  if (cooldownSeconds > 0) return;
  const step = s3StepsE[state.s3Index];
  const chosen = step.options[idx];
  if (!chosen.correct) {
    triggerClickCooldown(chosen.trap || "Inte riktigt! Läs alternativen noga.");
    return;
  }
  state.s3Score++;
  state.s3History.push({
    prompt: step.prompt,
    chosenText: chosen.text,
    explanation: step.explanation
  });
  state.s3Index++;
  render();
  if (autoTts) speakText("Rätt! " + step.explanation);
}

          <button type="button" class="option-btn" onclick="rateOral('green')">
            🟢 Vi fick med nyckelorden utan problem!
          </button>
          <button type="button" class="option-btn" onclick="rateOral('yellow')">
            🟡 Vi behövde kika på checklistan (nu sitter det!)
          </button>
        </div>
      `}
    </div>
  `;
}

function startOralTimer() {
  clearInterval(oralInterval);
  state.s5TimerVal = 45;
  state.s5TimerRunning = true;
  const disp = document.getElementById('oralTimerDisplay');
  if (disp) disp.textContent = state.s5TimerVal;

  oralInterval = setInterval(() => {
    state.s5TimerVal--;
    const d = document.getElementById('oralTimerDisplay');
    if (d) d.textContent = Math.max(0, state.s5TimerVal);
    if (state.s5TimerVal <= 0) {
      clearInterval(oralInterval);
      state.s5TimerRunning = false;
      showToast("⏱️ Tiden är ute! Dags att kolla facit.");
    }
  }, 1000);
}

function revealOral() {
  if (state.levelMode === 'E') {
    if (!state.s5OralChecks[0] || !state.s5OralChecks[1]) {
      showToast("Svara högt först och kryssa i båda nyckelorden innan ni öppnar facit!");
      return;
    }
  }
  clearInterval(oralInterval);
  state.s5Revealed = true;
  render();
}

function rateOral(rating) {
  const qList = state.levelMode === 'CA' ? s5QuestionsCA : s5QuestionsE;
  state.s5Ratings[state.s5Index] = rating;
  if (state.s5Index < qList.length - 1) {
    state.s5Index++;
    state.s5Revealed = false;
    state.s5OralChecks = [false, false];
    state.s5TimerVal = 45;
    render();
  } else {
    state.stage = 6;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
  }
}

/* --- STAGE 6: C/A DEPTH (CORRELATION VS CAUSATION) --- */
function renderStage6() {
  const isCA = state.levelMode === 'CA';
  const caIntro = isCA
    ? "Etapp 6: Fördjupning på C och A-nivå. Analysera skillnaden mellan ett statistiskt samband och ett verkligt orsakssamband."
    : "Grymt jobbat! Ni har klarat hela grundbanan och slutgenrepet. Vill ni sikta mot C eller A på provet kan ni göra den här bonusuppgiften om samband och orsakssamband – annars kan ni hoppa direkt till sammanfattningen.";

  return `
    <div class="card">
      <div class="card-header-row">
        <div>
          <span class="tag tag-ca">${isCA ? '🟣 C/A-nivå • Etapp 6 av 6' : '⭐ Valfri Bonus • Sikta mot C/A'}</span>
          <h2>Samband vs. Orsakssamband (Kausalitet)</h2>
        </div>
        ${ttsButton(caIntro, "Lyssna")}
      </div>

      <p data-autoread="${escapeHtml(caIntro)}">
        På provets C- och A-nivå imponerar det stort om ni kan förklara varför ett statistiskt <strong>samband</strong> inte automatiskt bevisar ett <strong>orsakssamband</strong>:
      </p>

      <div style="background: var(--bg-card-alt); padding: 18px; border-radius: 12px; border: 1px solid var(--border); margin: 16px 0;">
        <p><strong>Exempel:</strong> Statistik visar att under månader då det säljs mycket glass på byggvaruhusets kiosk ökar också antalet värmeslag på byggarbetsplatser. Glass orsakar förstås inte värmeslag – det är <strong>sommarvärmen</strong> (bakomliggande faktor) som orsakar båda!</p>
        <p><strong>Fråga:</strong> Hur tar forskare reda på om ett samband faktiskt är ett äkta <strong>orsakssamband</strong>?</p>

        <div class="options-grid">
          <button type="button" class="option-btn ${state.caCorrAnswered ? (state.caCorrCorrect ? 'correct' : 'wrong') : ''}"
            onclick="answerCaCorr(true)">
            Genom ett kontrollerat experiment med behandlingsgrupp och kontrollgrupp där man bara ändrar en faktor i taget och håller bakomliggande faktorer lika.
          </button>
          <button type="button" class="option-btn ${state.caCorrAnswered && !state.caCorrCorrect ? 'wrong' : ''}"
            onclick="answerCaCorr(false)">
            Genom att rita ett ännu större stapeldiagram i fina färger.
          </button>
        </div>

        <div style="margin-top: 18px;">
          <div class="no-paste-badge">🚫 Klistra in är avstängt – skriv med egna ord</div>
          <label for="txtCa">C/A-utmaning: Förklara med egna ord skillnaden mellan ett <strong>samband</strong> och ett <strong>orsakssamband</strong>:</label>
          <textarea id="txtCa" class="no-paste" rows="3" placeholder="Ett samband betyder att två saker hänger ihop i statistiken, medan ett orsakssamband betyder att...">${escapeHtml(state.caText)}</textarea>
        </div>
      </div>

      <div class="nav-footer">
        ${!isCA ? `
          <button type="button" class="btn-secondary" onclick="skipBonus()">
            Hoppa över bonus → Gå till sammanfattning
          </button>
        ` : `
          <button type="button" class="btn-secondary" onclick="state.stage = 5; window.scrollTo({top:0, behavior:'smooth'}); render();">
            ← Tillbaka till slutgenrepet
          </button>
        `}
        <button type="button" class="btn-primary" onclick="finishBonus()">
          Spara & gå till sammanfattning →
        </button>
      </div>
    </div>
  `;
}

function answerCaCorr(isOk) {
  state.caCorrAnswered = true;
  state.caCorrCorrect = isOk;
  if (!isOk) {
    showToast("Nja! Ett diagram visar bara sambandet – för att bevisa orsak krävs ett kontrollerat experiment.");
  }
  render();
}

function skipBonus() {
  state.didBonus = false;
  state.stage = 7;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function finishBonus() {
  const txt = document.getElementById('txtCa').value.trim();
  if (!state.caCorrCorrect && txt.length < 10) {
    showToast(
      state.levelMode === 'CA'
        ? "Svara rätt på flervalsfrågan och skriv en kort förklaring i rutan!"
        : "Svara på flervalsfrågan eller skriv ett kort svar i rutan – eller välj 'Hoppa över bonus'."
    );
    return;
  }
  state.caText = txt;
  state.didBonus = true;
  state.stage = 7;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

/* --- STAGE 7: FINAL SUMMARY & GOOGLE CLASSROOM COPY --- */
function buildSummaryReport() {
  const isCA = state.levelMode === 'CA';
  const mins = Math.max(1, Math.round((Date.now() - state.startTime) / 60000));
  const nowStr = new Date().toLocaleDateString('sv-SE');
  const q1Len = isCA ? s1CasesCA.length : s1StepsE.length;
  const s5Len = isCA ? s5QuestionsCA.length : s5QuestionsE.length;
  const greenCount = state.s5Ratings.filter(r => r === 'green').length;
  const studyName = isCA ? studyConfigsCA[state.selectedStudy].name : studyBuilderE[state.selectedStudy].name;

  const s2SummaryLine = isCA
    ? `• Etapp 2 (Vetenskap vs. Reklam & Samband): Definition ${state.s2DefCorrect ? 'Rätt' : 'Ej klar'} | Bygg-test: ${state.s2CaseScore} / ${s2CasesCA.length} rätt | Oberoende granskning: ${state.s2WhyCorrect ? 'Rätt' : 'Ej klar'}`
    : `• Etapp 2 (Vetenskap vs. Reklam & Samband): ${state.s2Score} / ${s2StepsE.length} klara`;

  let lines = [
    "==================================================",
    "SAMMANFATTNING: LEKTION 3 – BYGGLABBET: KÄLLKRITIK & SLUTGENREP",
    "Kurs: Naturkunskap 1a1 (Bygg- och anläggningsprogrammet)",
    "==================================================",
    `Datum: ${nowStr}`,
    `Elever: ${state.student1} & ${state.student2}`,
    state.classGroup ? `Klass/Grupp: ${state.classGroup}` : null,
    `Vald nivå i appen: ${isCA ? 'C/A-nivå' : 'E-nivå'}`,
    `Arbetstid i appen: ca ${mins} min`,
    "",
    "--- RESULTAT ÖVERSIKT ---",
    `• Etapp 1 (Reklam- & mytgranskaren): ${state.s1Score} / ${q1Len} rätt`,
    s2SummaryLine,
    `• Etapp 5 (Stora muntliga slutgenrepet): ${greenCount} / ${s5Len} provfrågor sattes direkt vid muntlig övning`,
    "",
    "--- PARETS SLUTSATSER & FELKÄLLOR (ETAPP 3) ---",
    "• Rimlig slutsats (Ergonomisk skruvdragare):",
    state.conc1Text || "(Ej ifyllt)",
    "",
    "• Felkälla / begränsning i undersökningen:",
    state.conc2Text || "(Ej ifyllt)",
    "",
    "--- PARETS STUDIEGRANSKNING (ETAPP 4) ---",
    `• Vald studie: ${studyName}`,
    `• Styrka i studien: ${state.studyGood || '(Ej valt)'}`,
    `• Felkälla / brist: ${state.studyFlaw || '(Ej valt)'}`,
    `• Förslag på förbättring: ${state.studyImprove || '(Ej valt)'}`,
    "• Egen sammanfattning av bedömningen:",
    state.studyWhyText || "(Ej ifyllt)",
    "",
    "--- PAR-SNACK #1 (KÄLLKRITISKA KONTROLLFRÅGOR) ---",
    state.pair1Text || "(Ej ifyllt)"
  ].filter(item => item !== null);

  if (state.didBonus) {
    lines.push(
      "",
      "--- FÖRDJUPNING (C/A-NIVÅ) ---",
      `• Samband vs. Orsak flerval: ${state.caCorrCorrect ? 'Rätt' : 'Försökt'}`,
      "• Egen förklaring av samband & orsakssamband:",
      state.caText || "(Ej ifyllt)"
    );
  }

  lines.push(
    "",
    "==================================================",
    "Hela serien (Lektion 1–3) klar för inlämning i Google Classroom!"
  );

  return lines.join("\n");
}

function renderSummary() {
  const report = buildSummaryReport();
  const doneAudio = "Fantastiskt jobbat! Ni har klarat hela Lektion 3 och är redo för det muntliga provet. Klicka på knappen Kopiera sammanfattning och klistra in texten under Lektion 2 i ert delade dokument i Google Classroom.";

  return `
    <div class="card">
      <div class="card-header-row">
        <div>
          <span class="tag tag-e">🏆 Hela serien klar! • Redo för Google Classroom</span>
          <h1>Grymt jobbat, ${escapeHtml(state.student1)} & ${escapeHtml(state.student2)}!</h1>
        </div>
        ${ttsButton(doneAudio, "Lyssna")}
      </div>

      <p data-autoread="${escapeHtml(doneAudio)}">
        Gör så här för att lämna in ert arbete från Lektion 3:
      </p>
      <ol>
        <li>Klicka på knappen <strong>”📋 Kopiera sammanfattning till Google Classroom”</strong> nedan.</li>
        <li>Öppna ert delade Google Dokument i <strong>Google Classroom</strong>.</li>
        <li>Ställ markören under <strong>Lektion 2</strong> och tryck <strong>Ctrl + V</strong> för att klistra in.</li>
      </ol>

      <div style="margin: 18px 0;">
        <button type="button" class="btn-primary" style="width: 100%; font-size: 1.15rem; padding: 16px;" onclick="copySummaryToClipboard()">
          📋 Kopiera sammanfattning till Google Classroom
        </button>
      </div>

      <label for="summaryOutput">Er färdiga sammanfattning (förhandsvisning):</label>
      <textarea id="summaryOutput" class="summary-textarea" readonly>${escapeHtml(report)}</textarea>

      <div class="nav-footer">
        <button type="button" class="btn-secondary" onclick="state.stage = 5; window.scrollTo({top:0, behavior:'smooth'}); render();">← Tillbaka till slutgenrepet</button>
      </div>
    </div>
  `;
}

function copySummaryToClipboard() {
  const textarea = document.getElementById('summaryOutput');
  const text = textarea.value;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showCopySuccess();
    }).catch(() => {
      fallbackCopy(textarea);
    });
  } else {
    fallbackCopy(textarea);
  }
}

function fallbackCopy(textarea) {
  textarea.select();
  textarea.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
    showCopySuccess();
  } catch (err) {
    showToast("Markera texten i rutan och tryck Ctrl + C för att kopiera.");
  }
}

function showCopySuccess() {
  showToast("✅ Kopierat! Gå till Google Classroom och tryck Ctrl + V under Lektion 2.", true);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Initial boot
render();
setTimeout(loadSwedishVoices, 300);
</script>
</body>
